services:
  app:
    container_name: rest-service

    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=adminpassword
      - DB_NAME=home-library-service
    ports:
      - 4000:4000
    networks:
      - app-network
    restart: always
  postgres:
    container_name: postgres
    build:
      context: .
      dockerfile: Dockerfile.db
    ports:
      - 5432:5432
    environment:
      PG_DATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    restart: always

volumes:
  pgdata:

networks:
  app-network:
